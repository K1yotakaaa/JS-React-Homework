<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#191414" />
    <title>Offline - Tunescape</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #191414;
        color: #f5f5f5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      .wrap { max-width: 420px; text-align: center; }
      .icon { font-size: 64px; margin-bottom: 16px; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0 0 24px; line-height: 1.5; color: #b3b3b3; }
      button {
        border: 0; border-radius: 999px; padding: 14px 24px; min-height: 48px;
        font-size: 16px; font-weight: 600; color: #0f0f0f; background: #1db954; cursor: pointer;
      }
      button:disabled { opacity: .6; }
      #status { margin-top: 16px; font-size: 14px; min-height: 1.4em; }
      @media (max-height: 480px) { .icon { font-size: 32px; margin-bottom: 8px; } p { margin-bottom: 12px; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>You're offline</h1>
      <p>Tunescape needs a connection for fresh data. Pages and public data you've already visited remain available.</p>
      <button id="retry" type="button">Retry connection</button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
    <script>
      var btn = document.getElementById('retry')
      var status = document.getElementById('status')
      btn.addEventListener('click', function () {
        btn.disabled = true
        status.textContent = 'Checking connection…'
        fetch('/manifest.json?__ping=' + Date.now(), { cache: 'no-store' })
          .then(function (r) {
            if (!r.ok) throw new Error('bad status')
            location.replace('/')
          })
          .catch(function () {
            status.textContent = 'Still offline. Please try again.'
            btn.disabled = false
          })
      })
    </script>
  </body>
</html>
